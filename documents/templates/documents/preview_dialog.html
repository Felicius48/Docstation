{% load static %}
<dialog class="pdf-picker" id="file-preview" aria-labelledby="preview-title">
  <div class="pdf-picker-inner">
    <div class="section-head">
      <h2 id="preview-title"></h2>
      <form method="dialog"><button class="button secondary" autofocus>Закрыть</button></form>
    </div>
    <p class="pdf-picker-name" id="preview-meta"></p>
    <div class="pdf-picker-controls">
      <button class="button secondary" type="button" id="preview-prev">Назад</button>
      <span id="preview-page" role="status"></span>
      <button class="button secondary" type="button" id="preview-next">Далее</button>
      <button class="button secondary" type="button" id="preview-smaller" aria-label="Уменьшить">−</button>
      <button class="button secondary" type="button" id="preview-larger" aria-label="Увеличить">+</button>
      <a class="button primary" id="preview-download">Скачать</a>
    </div>
    <p id="preview-status" role="status"></p>
    <div id="preview-surface" class="preview-surface" tabindex="0" aria-label="Содержимое файла"></div>
  </div>
</dialog>
<script type="module" src="{% static 'documents/file-preview.js' %}"></script>

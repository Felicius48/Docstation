{% if page.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Страницы">
    {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}{{ anchor }}">Назад</a>{% endif %}
    <span>{{ page.number }} из {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}{{ anchor }}">Далее</a>{% endif %}
  </nav>
{% endif %}

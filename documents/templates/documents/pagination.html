{% if page.paginator.num_pages > 1 %}
  <nav aria-label="Страницы">
    <ul class="pagination justify-content-center my-3">
      {% if page.has_previous %}
        <li class="page-item"><a class="page-link" rel="prev" href="{% querystring page=page.previous_page_number %}{{ anchor }}">Назад</a></li>
      {% endif %}
      <li class="page-item active"><span class="page-link" aria-current="page">{{ page.number }} из {{ page.paginator.num_pages }}</span></li>
      {% if page.has_next %}
        <li class="page-item"><a class="page-link" rel="next" href="{% querystring page=page.next_page_number %}{{ anchor }}">Далее</a></li>
      {% endif %}
    </ul>
  </nav>
{% endif %}

{% extends 'documents/base.html' %}
{% block title %}Черновик согласования · Docstation{% endblock %}
{% block content %}
<div class="intro detail-intro"><h1>Черновик согласования</h1></div>
<form class="panel version approval-form" method="post" {% if upload_new %}enctype="multipart/form-data"{% endif %}>
  {% csrf_token %}
  {% if upload_new %}<label>Файл для согласования<input type="file" name="file" required></label>{% endif %}
  {{ form.as_p }}
  <button class="button primary">Сохранить черновик</button>
</form>
{% endblock %}

# Install in /etc/nginx/conf.d/docstation.conf. Replace the address and TLS paths.
map "$request_method:$uri" $docstation_login_key {
    default "";
    ~^POST:/(login/|invite/[^/]+/)$ $binary_remote_addr;
}
limit_req_zone $docstation_login_key zone=docstation_login:1m rate=10r/m;

server {
    listen 192.168.51.109:443 ssl;
    server_name 192.168.51.109;
    ssl_certificate /etc/nginx/tls/docstation.crt;
    ssl_certificate_key /etc/nginx/tls/docstation.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;

    location / {
        limit_req zone=docstation_login burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }
}

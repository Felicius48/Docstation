services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - archive:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      target: worker
    network_mode: none
    volumes:
      - archive:/data
    depends_on:
      web:
        condition: service_healthy
    init: true
    restart: on-failure

volumes:
  archive:
